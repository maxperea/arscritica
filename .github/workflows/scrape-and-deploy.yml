name: Scrape and deploy

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore database
        run: bash scripts/data-branch.sh restore
      - run: pnpm db:init
      - name: Scrape
        if: github.event_name != 'push'
        continue-on-error: true
        run: pnpm scrape
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Backfill movie details
        if: github.event_name != 'push'
        continue-on-error: true
        run: pnpm backfill-details
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Persist database
        if: github.event_name != 'push'
        run: bash scripts/data-branch.sh persist
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
